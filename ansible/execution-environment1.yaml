---
- name: Diagnose AWX VMware Ansible environment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ============================================================
    # Ansible
    # ============================================================

    - name: Get Ansible version
      ansible.builtin.command:
        cmd: ansible --version
      register: cmd_ansible_version
      changed_when: false

    - name: Display Ansible version
      ansible.builtin.debug:
        var: cmd_ansible_version.stdout_lines


    # ============================================================
    # Python
    # ============================================================

    - name: Get Python version
      ansible.builtin.command:
        cmd: python3 --version
      register: cmd_python_version
      changed_when: false

    - name: Get Python executable
      ansible.builtin.command:
        cmd: which python3
      register: cmd_python_path
      changed_when: false

    - name: Display Python information
      ansible.builtin.debug:
        msg:
          - "Python version: {{ cmd_python_version.stdout }}"
          - "Python executable: {{ cmd_python_path.stdout }}"


    # ============================================================
    # Ansible collection paths
    # ============================================================

    - name: Display collection paths
      ansible.builtin.debug:
        msg:
          - "ANSIBLE_COLLECTIONS_PATHS={{ lookup('env', 'ANSIBLE_COLLECTIONS_PATHS') }}"
          - "ANSIBLE_COLLECTIONS_PATH={{ lookup('env', 'ANSIBLE_COLLECTIONS_PATH') }}"


    # ============================================================
    # Locate community.vmware
    # ============================================================

    - name: Find community.vmware collection
      ansible.builtin.shell: |
        find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type d \
          -path '*/ansible_collections/community/vmware' \
          2>/dev/null
      register: cmd_vmware_dirs
      changed_when: false

    - name: Display community.vmware locations
      ansible.builtin.debug:
        var: cmd_vmware_dirs.stdout_lines


    # ============================================================
    # Collection version
    # ============================================================

    - name: Find VMware collection metadata
      ansible.builtin.shell: |
        find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type f \
          \( \
            -path '*/ansible_collections/community/vmware/galaxy.yml' \
            -o \
            -path '*/ansible_collections/community/vmware/MANIFEST.json' \
          \) \
          2>/dev/null
      register: cmd_vmware_metadata
      changed_when: false

    - name: Display VMware metadata
      ansible.builtin.debug:
        var: cmd_vmware_metadata.stdout_lines


    - name: Read VMware collection version
      ansible.builtin.shell: |
        for f in $(find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type f \
          \( \
            -path '*/ansible_collections/community/vmware/galaxy.yml' \
            -o \
            -path '*/ansible_collections/community/vmware/MANIFEST.json' \
          \) \
          2>/dev/null); do

          echo "===== $f ====="

          grep -E '"version"|^version:' "$f" 2>/dev/null || true

        done
      register: cmd_vmware_version
      changed_when: false

    - name: Display VMware collection version
      ansible.builtin.debug:
        var: cmd_vmware_version.stdout_lines


    # ============================================================
    # Test module discovery
    # ============================================================

    - name: Inspect vmware_guest
      ansible.builtin.command:
        cmd: ansible-doc community.vmware.vmware_guest
      register: cmd_vmware_guest_doc
      changed_when: false
      failed_when: false

    - name: Display vmware_guest result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ cmd_vmware_guest_doc.rc }}"
          - "{{ cmd_vmware_guest_doc.stdout_lines[:25] }}"
          - "{{ cmd_vmware_guest_doc.stderr_lines[:25] }}"


    - name: Inspect vmware_vm_info
      ansible.builtin.command:
        cmd: ansible-doc community.vmware.vmware_vm_info
      register: cmd_vmware_vm_info_doc
      changed_when: false
      failed_when: false

    - name: Display vmware_vm_info result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ cmd_vmware_vm_info_doc.rc }}"
          - "{{ cmd_vmware_vm_info_doc.stdout_lines[:25] }}"
          - "{{ cmd_vmware_vm_info_doc.stderr_lines[:25] }}"


    # ============================================================
    # Python LooseVersion
    # ============================================================

    - name: Test LooseVersion
      ansible.builtin.command:
        cmd: >
          python3 -c
          "from distutils.version import LooseVersion;
          print(LooseVersion('1.0'))"
      register: cmd_looseversion
      changed_when: false
      failed_when: false

    - name: Display LooseVersion result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ cmd_looseversion.rc }}"
          - "STDOUT: {{ cmd_looseversion.stdout }}"
          - "STDERR: {{ cmd_looseversion.stderr }}"


    # ============================================================
    # Python packaging
    # ============================================================

    - name: Test packaging
      ansible.builtin.command:
        cmd: >
          python3 -c
          "import packaging;
          print(packaging.__version__)"
      register: cmd_packaging
      changed_when: false
      failed_when: false

    - name: Display packaging result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ cmd_packaging.rc }}"
          - "STDOUT: {{ cmd_packaging.stdout }}"
          - "STDERR: {{ cmd_packaging.stderr }}"


    # ============================================================
    # pyVmomi
    # ============================================================

    - name: Test pyVmomi
      ansible.builtin.command:
        cmd: >
          python3 -c
          "import pyVmomi;
          print(pyVmomi.__file__)"
      register: cmd_pyvmomi
      changed_when: false
      failed_when: false

    - name: Display pyVmomi result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ cmd_pyvmomi.rc }}"
          - "STDOUT: {{ cmd_pyvmomi.stdout }}"
          - "STDERR: {{ cmd_pyvmomi.stderr }}"


    # ============================================================
    # Python package versions
    # ============================================================

    - name: Show relevant Python packages
      ansible.builtin.shell: |
        python3 -m pip list 2>/dev/null |
        grep -Ei \
          'ansible|vmware|pyvmomi|vsphere|packaging|setuptools|distlib' ||
        true
      register: cmd_python_packages
      changed_when: false

    - name: Display Python packages
      ansible.builtin.debug:
        var: cmd_python_packages.stdout_lines


    # ============================================================
    # Locate support files
    # ============================================================

    - name: Find VMware support files
      ansible.builtin.shell: |
        find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type f \
          \( \
            -name 'LooseVersion.py' \
            -o -name 'version.py' \
            -o -name 'vmware*.py' \
          \) \
          2>/dev/null |
          head -300
      register: cmd_support_files
      changed_when: false

    - name: Display support files
      ansible.builtin.debug:
        var: cmd_support_files.stdout_lines


    # ============================================================
    # Exact module location
    # ============================================================

    - name: Find vmware_guest.py
      ansible.builtin.shell: |
        find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type f \
          -path '*/community/vmware/plugins/modules/vmware_guest.py' \
          2>/dev/null
      register: cmd_vmware_guest_path
      changed_when: false

    - name: Display vmware_guest.py location
      ansible.builtin.debug:
        var: cmd_vmware_guest_path.stdout_lines


    # ============================================================
    # Final summary
    # ============================================================

    - name: Display diagnostic summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "AWX VMware diagnostic complete"
          - "=============================================="
          - "Ansible:"
          - "{{ cmd_ansible_version.stdout_lines }}"
          - "Python:"
          - "{{ cmd_python_version.stdout }}"
          - "Python executable:"
          - "{{ cmd_python_path.stdout }}"
          - "VMware collection:"
          - "{{ cmd_vmware_dirs.stdout_lines }}"
          - "VMware version:"
          - "{{ cmd_vmware_version.stdout_lines }}"
          - "LooseVersion:"
          - "rc={{ cmd_looseversion.rc }}"
          - "stdout={{ cmd_looseversion.stdout }}"
          - "stderr={{ cmd_looseversion.stderr }}"
          - "Packaging:"
          - "rc={{ cmd_packaging.rc }}"
          - "stdout={{ cmd_packaging.stdout }}"
          - "stderr={{ cmd_packaging.stderr }}"
          - "pyVmomi:"
          - "rc={{ cmd_pyvmomi.rc }}"
          - "stdout={{ cmd_pyvmomi.stdout }}"
          - "stderr={{ cmd_pyvmomi.stderr }}"
          - "=============================================="
