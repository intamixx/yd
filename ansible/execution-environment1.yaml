---
- name: Diagnose AWX VMware Ansible environment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ------------------------------------------------------------
    # 1. Basic Ansible information
    # ------------------------------------------------------------

    - name: Show Ansible version
      ansible.builtin.command:
        cmd: ansible --version
      register: ansible_version
      changed_when: false

    - name: Display Ansible version
      ansible.builtin.debug:
        var: ansible_version.stdout_lines


    # ------------------------------------------------------------
    # 2. Python information
    # ------------------------------------------------------------

    - name: Show Python version
      ansible.builtin.command:
        cmd: python3 --version
      register: python_version
      changed_when: false

    - name: Show Python executable
      ansible.builtin.command:
        cmd: which python3
      register: python_path
      changed_when: false

    - name: Display Python information
      ansible.builtin.debug:
        msg:
          - "Python version: {{ python_version.stdout }}"
          - "Python executable: {{ python_path.stdout }}"


    # ------------------------------------------------------------
    # 3. Show Ansible collection paths
    # ------------------------------------------------------------

    - name: Show Ansible collection paths
      ansible.builtin.debug:
        msg:
          - "ANSIBLE_COLLECTIONS_PATHS = {{ lookup('env', 'ANSIBLE_COLLECTIONS_PATHS') }}"
          - "Ansible collection paths = {{ ansible_collections_paths | default('not available') }}"


    # ------------------------------------------------------------
    # 4. Locate community.vmware collection
    # ------------------------------------------------------------

    - name: Find community.vmware collection
      ansible.builtin.shell: |
        find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type d \
          -path '*/ansible_collections/community/vmware' \
          2>/dev/null
      register: vmware_collection_dirs
      changed_when: false

    - name: Display community.vmware locations
      ansible.builtin.debug:
        var: vmware_collection_dirs.stdout_lines


    # ------------------------------------------------------------
    # 5. Find collection metadata
    # ------------------------------------------------------------

    - name: Find community.vmware metadata files
      ansible.builtin.shell: |
        find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type f \
          \( -path '*/ansible_collections/community/vmware/galaxy.yml' \
          -o -path '*/ansible_collections/community/vmware/MANIFEST.json' \) \
          2>/dev/null
      register: vmware_metadata_files
      changed_when: false

    - name: Display VMware metadata files
      ansible.builtin.debug:
        var: vmware_metadata_files.stdout_lines


    # ------------------------------------------------------------
    # 6. Extract VMware collection version
    # ------------------------------------------------------------

    - name: Read VMware collection version
      ansible.builtin.shell: |
        for f in $(find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type f \
          \( -path '*/ansible_collections/community/vmware/galaxy.yml' \
          -o -path '*/ansible_collections/community/vmware/MANIFEST.json' \) \
          2>/dev/null); do

          echo "========================================"
          echo "FILE: $f"
          echo "========================================"

          grep -E '"version"|^version:' "$f" 2>/dev/null || true
        done
      register: vmware_version
      changed_when: false

    - name: Display VMware collection version
      ansible.builtin.debug:
        var: vmware_version.stdout_lines


    # ------------------------------------------------------------
    # 7. Test community.vmware module discovery
    # ------------------------------------------------------------

    - name: Inspect vmware_guest module
      ansible.builtin.command:
        cmd: ansible-doc community.vmware.vmware_guest
      register: vmware_guest_doc
      changed_when: false
      failed_when: false

    - name: Display vmware_guest module location
      ansible.builtin.debug:
        msg: >-
          {{ vmware_guest_doc.stdout_lines[:40] }}


    # ------------------------------------------------------------
    # 8. Test vmware_vm_info module discovery
    # ------------------------------------------------------------

    - name: Inspect vmware_vm_info module
      ansible.builtin.command:
        cmd: ansible-doc community.vmware.vmware_vm_info
      register: vmware_vm_info_doc
      changed_when: false
      failed_when: false

    - name: Display vmware_vm_info module information
      ansible.builtin.debug:
        msg: >-
          {{ vmware_vm_info_doc.stdout_lines[:40] }}


    # ------------------------------------------------------------
    # 9. Test LooseVersion
    # ------------------------------------------------------------

    - name: Test Python LooseVersion import
      ansible.builtin.command:
        cmd: >
          python3 -c
          "from distutils.version import LooseVersion;
          print(LooseVersion('1.0'))"
      register: looseversion_test
      changed_when: false
      failed_when: false

    - name: Display LooseVersion result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ looseversion_test.rc }}"
          - "STDOUT: {{ looseversion_test.stdout }}"
          - "STDERR: {{ looseversion_test.stderr }}"


    # ------------------------------------------------------------
    # 10. Test packaging Python module
    # ------------------------------------------------------------

    - name: Test Python packaging module
      ansible.builtin.command:
        cmd: >
          python3 -c
          "import packaging;
          print(packaging.__version__)"
      register: packaging_test
      changed_when: false
      failed_when: false

    - name: Display packaging result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ packaging_test.rc }}"
          - "STDOUT: {{ packaging_test.stdout }}"
          - "STDERR: {{ packaging_test.stderr }}"


    # ------------------------------------------------------------
    # 11. Test pyVmomi
    # ------------------------------------------------------------

    - name: Test pyVmomi import
      ansible.builtin.command:
        cmd: >
          python3 -c
          "import pyVmomi;
          print(pyVmomi.__file__)"
      register: pyvmomi_test
      changed_when: false
      failed_when: false

    - name: Display pyVmomi result
      ansible.builtin.debug:
        msg:
          - "Return code: {{ pyvmomi_test.rc }}"
          - "STDOUT: {{ pyvmomi_test.stdout }}"
          - "STDERR: {{ pyvmomi_test.stderr }}"


    # ------------------------------------------------------------
    # 12. Show installed Python VMware-related packages
    # ------------------------------------------------------------

    - name: Show VMware Python packages
      ansible.builtin.shell: |
        python3 -m pip list 2>/dev/null |
        grep -Ei 'vmware|pyvmomi|vsphere|packaging|setuptools' ||
        true
      register: python_vmware_packages
      changed_when: false

    - name: Display VMware Python packages
      ansible.builtin.debug:
        var: python_vmware_packages.stdout_lines


    # ------------------------------------------------------------
    # 13. Locate VMware Python support files
    # ------------------------------------------------------------

    - name: Find VMware support files
      ansible.builtin.shell: |
        find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type f \
          \( -name 'LooseVersion.py'
          -o -name 'version.py'
          -o -name 'vmware*.py'
          -o -name 'pyVmomi*.py' \) \
          2>/dev/null |
          head -300
      register: vmware_support_files
      changed_when: false

    - name: Display VMware support files
      ansible.builtin.debug:
        var: vmware_support_files.stdout_lines


    # ------------------------------------------------------------
    # 14. Show exact vmware_guest module path
    # ------------------------------------------------------------

    - name: Find vmware_guest.py
      ansible.builtin.shell: |
        find /tmp /var/lib/awx/.ansible/collections /usr/share/ansible/collections \
          -type f \
          -path '*/community/vmware/plugins/modules/vmware_guest.py' \
          2>/dev/null
      register: vmware_guest_path
      changed_when: false

    - name: Display vmware_guest.py location
      ansible.builtin.debug:
        var: vmware_guest_path.stdout_lines


    # ------------------------------------------------------------
    # 15. Final summary
    # ------------------------------------------------------------

    - name: Display diagnostic summary
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "AWX VMware diagnostic complete"
          - "=============================================="
          - ""
          - "Ansible:"
          - "{{ ansible_version.stdout }}"
          - ""
          - "Python:"
          - "{{ python_version.stdout }}"
          - ""
          - "Python executable:"
          - "{{ python_path.stdout }}"
          - ""
          - "VMware collection locations:"
          - "{{ vmware_collection_dirs.stdout_lines }}"
          - ""
          - "VMware collection metadata:"
          - "{{ vmware_metadata_files.stdout_lines }}"
          - ""
          - "LooseVersion test:"
          - "{{ looseversion_test.rc }} / {{ looseversion_test.stdout }} / {{ looseversion_test.stderr }}"
          - ""
          - "Packaging test:"
          - "{{ packaging_test.rc }} / {{ packaging_test.stdout }} / {{ packaging_test.stderr }}"
          - ""
          - "pyVmomi test:"
          - "{{ pyvmomi_test.rc }} / {{ pyvmomi_test.stdout }} / {{ pyvmomi_test.stderr }}"
          - ""
          - "Python VMware packages:"
          - "{{ python_vmware_packages.stdout_lines }}"
          - "=============================================="
