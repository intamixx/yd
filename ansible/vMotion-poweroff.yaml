---
- name: Power down VM before vMotion
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - group_vars/vars.yaml
    - group_vars/vault.yaml

  vars:
    vm_name: "TEMPLATE"

  collections:
    - community.vmware

  tasks:

    # ============================================================
    # Find all VMs
    # community.vmware 1.7.0 does not support vm_name on
    # vmware_vm_info, so we retrieve the list and filter it.
    # ============================================================

    - name: Get VMware VM information
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        vm_type: vm
      delegate_to: localhost
      register: vm_info

    - name: Find VM matching requested name
      ansible.builtin.set_fact:
        matching_vms: >-
          {{
            vm_info.virtual_machines
            | selectattr('guest_name', 'equalto', vm_name)
            | list
          }}

    - name: Display matching VM count
      ansible.builtin.debug:
        msg:
          - "Requested VM: {{ vm_name }}"
          - "Matching VMs found: {{ matching_vms | length }}"


    # ============================================================
    # Verify exactly one VM was found
    # ============================================================

    - name: Verify exactly one VM was found
      ansible.builtin.assert:
        that:
          - matching_vms | length == 1
        fail_msg: >-
          Expected exactly one VM named '{{ vm_name }}',
          but found {{ matching_vms | length }}.

          Matching VMs:
          {{ matching_vms | map(attribute='guest_name') | list }}


    # ============================================================
    # Save VM information
    # ============================================================

    - name: Set VM information
      ansible.builtin.set_fact:
        vm_before: "{{ matching_vms[0] }}"
        vm_moid: "{{ matching_vms[0].moid }}"

    - name: Display VM before power down
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "VM FOUND"
          - "=========================================="
          - "VM: {{ vm_name }}"
          - "MoID: {{ vm_moid }}"
          - "Cluster: {{ vm_before.cluster | default('N/A') }}"
          - "Host: {{ vm_before.esxi_hostname | default('N/A') }}"
          - "Power state: {{ vm_before.power_state }}"
          - "=========================================="


    # ============================================================
    # Verify current power state
    # ============================================================

    - name: Verify VM is currently powered on
      ansible.builtin.assert:
        that:
          - vm_before.power_state == "poweredOn"
        fail_msg: >-
          VM '{{ vm_name }}' is not powered on.
          Current state: {{ vm_before.power_state }}


    # ============================================================
    # Power off VM
    # ============================================================

    - name: Power down VM
      community.vmware.vmware_guest_powerstate:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        moid: "{{ vm_moid }}"
        state: powered-off
        state_change_timeout: 300
      delegate_to: localhost


    # ============================================================
    # Give vCenter a moment to update inventory state
    # ============================================================

    - name: Wait for vCenter power state update
      ansible.builtin.pause:
        seconds: 5


    # ============================================================
    # Refresh VM information
    # ============================================================

    - name: Refresh VMware VM information
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        vm_type: vm
      delegate_to: localhost
      register: vm_after_info


    # ============================================================
    # Find the VM again
    # ============================================================

    - name: Find VM after power down
      ansible.builtin.set_fact:
        matching_vms_after: >-
          {{
            vm_after_info.virtual_machines
            | selectattr('guest_name', 'equalto', vm_name)
            | list
          }}

    - name: Verify VM still exists
      ansible.builtin.assert:
        that:
          - matching_vms_after | length == 1
        fail_msg: >-
          VM '{{ vm_name }}' could not be uniquely located
          after the power-down operation.

          Matching VMs found:
          {{ matching_vms_after | length }}


    # ============================================================
    # Save post-powerdown information
    # ============================================================

    - name: Set post-powerdown VM information
      ansible.builtin.set_fact:
        vm_after: "{{ matching_vms_after[0] }}"


    # ============================================================
    # Verify power off succeeded
    # ============================================================

    - name: Verify VM is powered off
      ansible.builtin.assert:
        that:
          - vm_after.moid == vm_moid
          - vm_after.power_state == "poweredOff"
        fail_msg: >-
          VM '{{ vm_name }}' did not power off successfully.

          MoID before: {{ vm_moid }}
          MoID after: {{ vm_after.moid | default('N/A') }}

          Power state after:
          {{ vm_after.power_state | default('N/A') }}


    # ============================================================
    # PASS
    # ============================================================

    - name: Display powerdown PASS
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "POWERDOWN PASS"
          - "=========================================="
          - "VM: {{ vm_name }}"
          - "MoID: {{ vm_after.moid }}"
          - "Cluster: {{ vm_after.cluster | default('N/A') }}"
          - "Host: {{ vm_after.esxi_hostname | default('N/A') }}"
          - "Power state: {{ vm_after.power_state }}"
          - "Ready for cold migration"
          - "=========================================="
