---
- name: Validate SCCM PR-9
  hosts: localhost
  gather_facts: false

#  vars:

    # ========================================================
    # VCENTER
    # ========================================================

#    vcenter_hostname: "127.0.0.1"
#    vcenter_username: "user"
#    vcenter_password: "pass"
#    vcenter_port: 8989

  vars_files:
    - group_vars/vault.yaml
    - group_vars/vars.yaml

  vars:

    datacenter_name: "DC0"


    # ========================================================
    # PR-8
    #
    # Production Cluster 1
    #
    # hrp-wld2-cluster1
    #   SCCOPS001-AP1
    #     BGB01AP1519
    # ========================================================

    pr8:
      cluster: "hrp-wld2-cluster1"
      resource_pool: "SCCOPS001-AP1"
      vms:
        - "BGB01AP1519"


    # ========================================================
    # PR-9
    #
    # Production Cluster 1
    #
    # VM Group:
    #   SCCOPS001-GP1
    #
    # Host Group:
    #   Cluster1-AZ1-Host
    #
    # Rule:
    #   SCCOPS001-HA1
    #   SHOULD RUN
    # ========================================================

    pr9:
      cluster: "hrp-wld2-cluster1"

      vm_group: "SCCOPS001-GP1"

      vm:
        - "BGB01AP1519"

      host_group: "Cluster1-AZ1-Host"

      hosts:
        - "fgbw1vhesx1001.national.core.bbc.co.uk"

      rule: "SCCOPS001-HA1"


    # ========================================================
    # PR-10
    #
    # Cluster 2
    #
    # hrp-wld2-cluster2-az1
    #   SCCOPS001-AP2
    #     BDC02AP1001
    #     BDC02CN1001
    # ========================================================

    pr10:
      cluster: "hrp-wld2-cluster2-az1"
      resource_pool: "SCCOPS001-AP2"

      vms:
        - "BDC02AP1001"
        - "BDC02CN1001"


    # ========================================================
    # PR-11
    #
    # Cluster 3
    #
    # hrp-wld2-cluster3-az2
    #
    # Following the PR-11 requirement as originally supplied:
    # SCCOPS001-AP2
    #
    # If FB-6 is authoritative instead, change AP2 to AP3.
    # ========================================================

    pr11:
      cluster: "hrp-wld2-cluster3-az2"
      resource_pool: "SCCOPS001-AP2"

      vms:
        - "BDC03AP1001"
        - "BDC03CN1001"


    # ========================================================
    # PR-12
    #
    # BCDR Cluster
    #
    # hrp-wld2-cluster4-dr1
    #   SCCOPS001-AP4
    # ========================================================

    pr12:
      cluster: "hrp-wld2-cluster4-dr1"
      resource_pool: "SCCOPS001-AP4"


    # ========================================================
    # PR-13
    #
    # BCDR Cluster
    #
    # VM Group:
    #   SCCOPS001-GP1
    #
    # Host Group:
    #   Cluster4-AZ1-Host
    #
    # Rule:
    #   SCCOPS001-HA1
    #   SHOULD RUN
    # ========================================================

    pr13:
      cluster: "hrp-wld2-cluster4-dr1"

      vm_group: "SCCOPS001-GP1"

      vm:
        - "BGB01AP1519"

      host_group: "Cluster4-AZ1-Host"

      hosts:
        - "DC0_C0_H0"
        - "DC0_C0_H1"

      rule: "SCCOPS001-HA1"


    # ========================================================
    # PR-14
    #
    # BCDR Cluster
    #
    # VM Group:
    #   Cluster4-AZ1-VM
    #
    # Host Group:
    #   Cluster4-AZ1-Host
    #
    # Rule:
    #   Cluster4-AZ1-VM
    #   MUST RUN
    # ========================================================

    pr14:
      cluster: "hrp-wld2-cluster4-dr1"

      vm_group: "Cluster4-AZ1-VM"

      vms:
        - "BDC02AP1001"
        - "BDC02CN1001"

      host_group: "Cluster4-AZ1-Host"

      rule: "Cluster4-AZ1-VM"


  tasks:

    # ========================================================
    # VM INVENTORY
    # ========================================================

    - name: Gather VMware VM inventory
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        port: "{{ vcenter_port }}"
        validate_certs: false
      register: vm_info
      delegate_to: localhost


    # ========================================================
    # RESOURCE POOL INFORMATION
    # ========================================================

    - name: Gather VMware resource pool information
      community.vmware.vmware_resource_pool_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        port: "{{ vcenter_port }}"
        validate_certs: false
      register: resource_pool_info
      delegate_to: localhost


    # ========================================================
    # DRS GROUPS
    #
    # IMPORTANT:
    # cluster_name and datacenter are mutually exclusive in
    # your installed community.vmware collection.
    #
    # Therefore cluster_name is used by itself.
    # ========================================================

    - name: Gather DRS groups - PR-9 production cluster
      community.vmware.vmware_drs_group_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        port: "{{ vcenter_port }}"
        cluster_name: "{{ pr9.cluster }}"
        validate_certs: false
      register: pr9_group_info
      delegate_to: localhost


    # ========================================================
    # DRS RULES
    # ========================================================

    - name: Gather DRS rules - PR-9 production cluster
      community.vmware.vmware_drs_rule_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        port: "{{ vcenter_port }}"
        cluster_name: "{{ pr9.cluster }}"
        validate_certs: false
      register: pr9_rule_info
      delegate_to: localhost


    # ========================================================
    # DEBUG - SHOW ACTUAL MODULE RESULTS
    #
    # Keep these for the first run. They let us verify exactly
    # what your installed collection returns.
    # ========================================================

    - name: Show production DRS groups
      ansible.builtin.debug:
        var: pr9_group_info.drs_group_info


    - name: Show production DRS rules
      ansible.builtin.debug:
        var: pr9_rule_info.drs_rule_info


    # ========================================================
    # BUILD VM LOOKUP
    # ========================================================

    - name: Build VM lookup by guest name
      ansible.builtin.set_fact:
        vm_by_name: >-
          {{
            dict(
              vm_info.virtual_machines
              | map(attribute='guest_name')
              | zip(vm_info.virtual_machines)
            )
          }}


    # ========================================================
    # BUILD RESOURCE POOL LOOKUP
    # ========================================================

    - name: Build resource pool lookup
      ansible.builtin.set_fact:
        resource_pool_by_name: >-
          {{
            dict(
              resource_pool_info.resource_pool_info
              | map(attribute='name')
              | zip(resource_pool_info.resource_pool_info)
            )
          }}

    # ========================================================
    # PR-9
    # ========================================================

    - name: "PR-9 - Extract production groups"
      ansible.builtin.set_fact:
        pr9_groups: >-
          {{
            pr9_group_info.drs_group_info[pr9.cluster]
            | default([])
          }}


    - name: "PR-9 - Extract production rules"
      ansible.builtin.set_fact:
        pr9_rules: >-
          {{
            pr9_rule_info.drs_rule_info[pr9.cluster]
            | default([])
          }}


    # --------------------------------------------------------
    # VM GROUP
    # --------------------------------------------------------

    - name: "PR-9 - Locate VM group"
      ansible.builtin.set_fact:
        pr9_vm_group_data: >-
          {{
            pr9_groups
            | selectattr('type', 'equalto', 'vm')
            | selectattr('group_name', 'equalto', pr9.vm_group)
            | list
          }}


    - name: "PR-9 - VM group exists"
      ansible.builtin.assert:
        that:
          - pr9_vm_group_data | length == 1
        fail_msg: >-
          PR-9 FAIL:
          VM group '{{ pr9.vm_group }}' not found.
        success_msg: >-
          PR-9 PASS:
          VM group '{{ pr9.vm_group }}' exists.


    - name: "PR-9 - VM group membership"
      ansible.builtin.assert:
        that:
          - pr9.vm | difference(pr9_vm_group_data[0].vms | default([])) | length == 0
        fail_msg: >-
          PR-9 FAIL:
          expected {{ pr9.vm }} in {{ pr9.vm_group }},
          actual:
          {{ pr9_vm_group_data[0].vms | default([]) }}.
        success_msg: >-
          PR-9 PASS:
          {{ pr9.vm_group }} contains {{ pr9.vm }}.


    # --------------------------------------------------------
    # HOST GROUP
    # --------------------------------------------------------

    - name: "PR-9 - Locate host group"
      ansible.builtin.set_fact:
        pr9_host_group_data: >-
          {{
            pr9_groups
            | selectattr('type', 'equalto', 'host')
            | selectattr('group_name', 'equalto', pr9.host_group)
            | list
          }}


    - name: "PR-9 - Host group exists"
      ansible.builtin.assert:
        that:
          - pr9_host_group_data | length == 1
        fail_msg: >-
          PR-9 FAIL:
          host group '{{ pr9.host_group }}' not found.
        success_msg: >-
          PR-9 PASS:
          host group '{{ pr9.host_group }}' exists.


    - name: "PR-9 - Host group membership"
      ansible.builtin.assert:
        that:
          - pr9.hosts | difference(pr9_host_group_data[0].hosts | default([])) | length == 0
        fail_msg: >-
          PR-9 FAIL:
          expected hosts {{ pr9.hosts }},
          actual:
          {{ pr9_host_group_data[0].hosts | default([]) }}.
        success_msg: >-
          PR-9 PASS:
          {{ pr9.host_group }} contains expected hosts.


    # --------------------------------------------------------
    # RULE
    # --------------------------------------------------------

    - name: "PR-9 - Locate HA rule"
      ansible.builtin.set_fact:
        pr9_rule_data: >-
          {{
            pr9_rules
            | selectattr('rule_name', 'equalto', pr9.rule)
            | list
          }}


    - name: "PR-9 - Rule exists"
      ansible.builtin.assert:
        that:
          - pr9_rule_data | length == 1
        fail_msg: >-
          PR-9 FAIL:
          rule '{{ pr9.rule }}' not found.
        success_msg: >-
          PR-9 PASS:
          rule '{{ pr9.rule }}' exists.


    - name: "PR-9 - Rule enabled"
      ansible.builtin.assert:
        that:
          - pr9_rule_data[0].rule_enabled | bool
        fail_msg: >-
          PR-9 FAIL:
          rule '{{ pr9.rule }}' is disabled.
        success_msg: >-
          PR-9 PASS:
          rule '{{ pr9.rule }}' is enabled.


    - name: "PR-9 - Rule is SHOULD RUN"
      ansible.builtin.assert:
        that:
          - not (pr9_rule_data[0].rule_mandatory | bool)
        fail_msg: >-
          PR-9 FAIL:
          rule '{{ pr9.rule }}' is MUST RUN,
          expected SHOULD RUN.
        success_msg: >-
          PR-9 PASS:
          rule '{{ pr9.rule }}' is SHOULD RUN.


    - name: "PR-9 - Rule references correct VM group"
      ansible.builtin.assert:
        that:
          - pr9_rule_data[0].rule_vm_group_name == pr9.vm_group
        fail_msg: >-
          PR-9 FAIL:
          rule VM group is
          '{{ pr9_rule_data[0].rule_vm_group_name }}',
          expected '{{ pr9.vm_group }}'.
        success_msg: >-
          PR-9 PASS:
          rule references {{ pr9.vm_group }}.


    - name: "PR-9 - Rule references correct host group"
      ansible.builtin.assert:
        that:
          - pr9_rule_data[0].rule_affine_host_group_name == pr9.host_group
        fail_msg: >-
          PR-9 FAIL:
          rule host group is
          '{{ pr9_rule_data[0].rule_affine_host_group_name }}',
          expected '{{ pr9.host_group }}'.
        success_msg: >-
          PR-9 PASS:
          rule references {{ pr9.host_group }}.
