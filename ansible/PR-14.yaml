---
- name: Validate SCCM PR-14
  hosts: localhost
  gather_facts: false
  vars_files:
    - group_vars/vault.yaml
    - group_vars/vars.yaml
  vars:

    # ========================================================
    # VCENTER
    # ========================================================

#    vcenter_hostname: "127.0.0.1"
#    vcenter_username: "user"
#    vcenter_password: "pass"
#    vcenter_port: 8989

    datacenter_name: "DC0"


    # ========================================================
    # PR-8
    #
    # Production Cluster 1
    #
    # hrp-wld2-cluster1
    #   SCCOPS001-AP1
    #     BGB01AP1519
    # ========================================================

    pr8:
      cluster: "hrp-wld2-cluster1"
      resource_pool: "SCCOPS001-AP1"
      vms:
        - "BGB01AP1519"


    # ========================================================
    # PR-9
    #
    # Production Cluster 1
    #
    # VM Group:
    #   SCCOPS001-GP1
    #
    # Host Group:
    #   Cluster1-AZ1-Host
    #
    # Rule:
    #   SCCOPS001-HA1
    #   SHOULD RUN
    # ========================================================

    pr9:
      cluster: "hrp-wld2-cluster1"

      vm_group: "SCCOPS001-GP1"

      vm:
        - "BGB01AP1519"

      host_group: "Cluster1-AZ1-Host"

      hosts:
        - "DC0_C1_H0"
        - "DC0_C1_H1"

      rule: "SCCOPS001-HA1"


    # ========================================================
    # PR-10
    #
    # Cluster 2
    #
    # hrp-wld2-cluster2-az1
    #   SCCOPS001-AP2
    #     BDC02AP1001
    #     BDC02CN1001
    # ========================================================

    pr10:
      cluster: "hrp-wld2-cluster2-az1"
      resource_pool: "SCCOPS001-AP2"

      vms:
        - "BDC02AP1001"
        - "BDC02CN1001"


    # ========================================================
    # PR-11
    #
    # Cluster 3
    #
    # hrp-wld2-cluster3-az2
    #
    # Following the PR-11 requirement as originally supplied:
    # SCCOPS001-AP2
    #
    # If FB-6 is authoritative instead, change AP2 to AP3.
    # ========================================================

    pr11:
      cluster: "hrp-wld2-cluster3-az2"
      resource_pool: "SCCOPS001-AP2"

      vms:
        - "BDC03AP1001"
        - "BDC03CN1001"


    # ========================================================
    # PR-12
    #
    # BCDR Cluster
    #
    # hrp-wld2-cluster4-dr1
    #   SCCOPS001-AP4
    # ========================================================

    pr12:
      cluster: "hrp-wld2-cluster4-dr1"
      resource_pool: "SCCOPS001-AP4"


    # ========================================================
    # PR-13
    #
    # BCDR Cluster
    #
    # VM Group:
    #   SCCOPS001-GP1
    #
    # Host Group:
    #   Cluster4-AZ1-Host
    #
    # Rule:
    #   SCCOPS001-HA1
    #   SHOULD RUN
    # ========================================================

    pr13:
      cluster: "hrp-wld2-cluster4-dr1"

      vm_group: "SCCOPS001-GP1"

      vm:
        - "BGB01AP1519"

      host_group: "Cluster4-AZ1-Host"

      hosts:
        - "DC0_C0_H0"
        - "DC0_C0_H1"

      rule: "SCCOPS001-HA1"


    # ========================================================
    # PR-14
    #
    # BCDR Cluster
    #
    # VM Group:
    #   Cluster4-AZ1-VM
    #
    # Host Group:
    #   Cluster4-AZ1-Host
    #
    # Rule:
    #   Cluster4-AZ1-VM
    #   MUST RUN
    # ========================================================

    pr14:
      cluster: "hrp-wld2-cluster4-dr1"

      #vm_group: "Cluster4-AZ1-VM"
      vm_group: "SCCOPS001-GP1"

      vms:
        - "BDC02AP1001"
        - "BDC02CN1001"

      host_group: "Cluster4-AZ1-Host"

      rule: "Cluster4-AZ1-VM"


  tasks:

    # ========================================================
    # VM INVENTORY
    # ========================================================

    - name: Gather VMware VM inventory
      community.vmware.vmware_vm_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        port: "{{ vcenter_port }}"
        validate_certs: false
      register: vm_info
      delegate_to: localhost


    # ========================================================
    # RESOURCE POOL INFORMATION
    # ========================================================

    - name: Gather VMware resource pool information
      community.vmware.vmware_resource_pool_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        port: "{{ vcenter_port }}"
        validate_certs: false
      register: resource_pool_info
      delegate_to: localhost


    # ========================================================
    # DRS GROUPS
    #
    # IMPORTANT:
    # cluster_name and datacenter are mutually exclusive in
    # your installed community.vmware collection.
    #
    # Therefore cluster_name is used by itself.
    # ========================================================

    - name: Gather DRS groups - PR-13 and PR-14 BCDR cluster
      community.vmware.vmware_drs_group_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        port: "{{ vcenter_port }}"
        cluster_name: "{{ pr13.cluster }}"
        validate_certs: false
      register: bcdr_group_info
      delegate_to: localhost


    # ========================================================
    # DRS RULES
    # ========================================================

    - name: Gather DRS rules - PR-13 and PR-14 BCDR cluster
      community.vmware.vmware_drs_rule_info:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        port: "{{ vcenter_port }}"
        cluster_name: "{{ pr13.cluster }}"
        validate_certs: false
      register: bcdr_rule_info
      delegate_to: localhost


    # ========================================================
    # DEBUG - SHOW ACTUAL MODULE RESULTS
    #
    # Keep these for the first run. They let us verify exactly
    # what your installed collection returns.
    # ========================================================

    - name: Show BCDR DRS groups
      ansible.builtin.debug:
        var: bcdr_group_info.drs_group_info


    - name: Show BCDR DRS rules
      ansible.builtin.debug:
        var: bcdr_rule_info.drs_rule_info

    # ========================================================
    # BUILD VM LOOKUP
    # ========================================================

    - name: Build VM lookup by guest name
      ansible.builtin.set_fact:
        vm_by_name: >-
          {{
            dict(
              vm_info.virtual_machines
              | map(attribute='guest_name')
              | zip(vm_info.virtual_machines)
            )
          }}


    # ========================================================
    # BUILD RESOURCE POOL LOOKUP
    # ========================================================

    - name: Build resource pool lookup
      ansible.builtin.set_fact:
        resource_pool_by_name: >-
          {{
            dict(
              resource_pool_info.resource_pool_info
              | map(attribute='name')
              | zip(resource_pool_info.resource_pool_info)
            )
          }}


    # ========================================================
    # PR-14
    # ========================================================

    - name: "PR-14 - Locate VM group"
      ansible.builtin.set_fact:
        pr14_vm_group_data: >-
          {{
            (
              bcdr_group_info.drs_group_info[pr14.cluster]
              | default([])
            )
            | selectattr('type', 'equalto', 'vm')
            | selectattr('group_name', 'equalto', pr14.vm_group)
            | list
          }}


    - name: "PR-14 - VM group exists"
      ansible.builtin.assert:
        that:
          - pr14_vm_group_data | length == 1
        fail_msg: >-
          PR-14 FAIL:
          VM group '{{ pr14.vm_group }}' does not exist.
        success_msg: >-
          PR-14 PASS:
          VM group '{{ pr14.vm_group }}' exists.


#    - name: "PR-14 - VM group membership"
#      ansible.builtin.assert:
#        that:
#          - pr14.vms | difference(pr14_vm_group_data[0].vms | default([])) | length == 0
#        fail_msg: >-
#          PR-14 FAIL:
#          expected {{ pr14.vms }},
#          actual:
#          {{ pr14_vm_group_data[0].vms | default([]) }}.
#        success_msg: >-
#          PR-14 PASS:
#          fixed VMs are in {{ pr14.vm_group }}.

    - name: "PR-13 - Locate host group"
      ansible.builtin.set_fact:
        pr13_host_group_data: >-
          {{
            (
              bcdr_group_info.drs_group_info[pr13.cluster]
              | default([])
            )
            | selectattr('type', 'equalto', 'host')
            | selectattr('group_name', 'equalto', pr13.host_group)
            | list
          }}


    - name: "PR-14 - Host group exists"
      ansible.builtin.assert:
        that:
          - pr13_host_group_data | length == 1
        fail_msg: >-
          PR-14 FAIL:
          host group '{{ pr14.host_group }}' does not exist.
        success_msg: >-
          PR-14 PASS:
          host group '{{ pr14.host_group }}' exists.


    - name: "PR-14 - Locate MUST RUN rule"
      ansible.builtin.set_fact:
        pr14_rule_data: >-
          {{
            (
              bcdr_rule_info.drs_rule_info[pr14.cluster]
              | default([])
            )
            | selectattr('rule_name', 'equalto', pr14.rule)
            | list
          }}


    - name: "PR-14 - Rule exists"
      ansible.builtin.assert:
        that:
          - pr14_rule_data | length == 1
        fail_msg: >-
          PR-14 FAIL:
          MUST RUN rule '{{ pr14.rule }}' does not exist.
        success_msg: >-
          PR-14 PASS:
          MUST RUN rule '{{ pr14.rule }}' exists.


    - name: "PR-14 - Rule enabled"
      ansible.builtin.assert:
        that:
          - pr14_rule_data[0].rule_enabled | bool
        fail_msg: >-
          PR-14 FAIL:
          rule '{{ pr14.rule }}' is disabled.
        success_msg: >-
          PR-14 PASS:
          rule '{{ pr14.rule }}' is enabled.


    - name: "PR-14 - Rule is MUST RUN"
      ansible.builtin.assert:
        that:
          - pr14_rule_data[0].rule_mandatory | bool
        fail_msg: >-
          PR-14 FAIL:
          rule '{{ pr14.rule }}' is SHOULD RUN.
        success_msg: >-
          PR-14 PASS:
          rule '{{ pr14.rule }}' is MUST RUN.


    - name: "PR-14 - Correct VM group"
      ansible.builtin.assert:
        that:
          - pr14_rule_data[0].rule_vm_group_name == pr14.vm_group
        fail_msg: >-
          PR-14 FAIL:
          wrong VM group:
          {{ pr14_rule_data[0].rule_vm_group_name }}.
        success_msg: >-
          PR-14 PASS:
          correct VM group.


    - name: "PR-14 - Correct host group"
      ansible.builtin.assert:
        that:
          - pr14_rule_data[0].rule_affine_host_group_name == pr14.host_group
        fail_msg: >-
          PR-14 FAIL:
          wrong host group:
          {{ pr14_rule_data[0].rule_affine_host_group_name }}.
        success_msg: >-
          PR-14 PASS:
          correct host group.
