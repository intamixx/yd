---
- name: Test custom Ansible virtualenv
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Show Python executable
      command: python3 -c "import sys; print(sys.executable)"
      register: python_exe
      changed_when: false

    - name: Show Python version
      command: python3 --version
      register: python_version
      changed_when: false

    - name: Show Ansible version
      command: ansible --version
      register: ansible_version
      changed_when: false

    - name: Display environment
      debug:
        msg:
          - "Python executable: {{ python_exe.stdout }}"
          - "Python version: {{ python_version.stdout }}"
          - "Ansible: {{ ansible_version.stdout_lines }}"
